name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [shared, core, node, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff || true
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package.json
      - name: Install
        working-directory: dashboard
        run: npm install
      - name: Build
        working-directory: dashboard
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build core image
        run: docker build -f core/Dockerfile -t honeybee-core:ci .
      - name: Build node image
        run: docker build -f node/Dockerfile -t honeybee-node:ci .
      - name: Build dashboard image
        run: docker build -t honeybee-dashboard:ci ./dashboard
