name: auto-release

# Runs after the CI workflow completes successfully on main.
# Bumps the patch version, pushes a new tag, builds binaries, and publishes a GitHub Release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  # ── Step 1: compute and push new tag ───────────────────────────────────────
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: bump
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [[ -z "$LATEST" ]]; then
            LATEST="v0.0.0"
          fi
          MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Latest: $LATEST  →  New: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Push new tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

  # ── Step 2: build node binary for every platform ───────────────────────────
  build:
    needs: tag
    name: build/${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: node/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          ASSET="honeybee-node-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          mkdir -p dist
          cd node
          go build \
            -ldflags="-s -w -X main.Version=${{ needs.tag.outputs.new_tag }}" \
            -o "../dist/${ASSET}" ./cmd

      - uses: actions/upload-artifact@v4
        with:
          name: honeybee-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ── Step 3: publish GitHub Release ─────────────────────────────────────────
  release:
    needs: [tag, build]
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          files: dist/**
          generate_release_notes: true
