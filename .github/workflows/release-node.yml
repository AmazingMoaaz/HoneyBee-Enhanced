name: release-node

# Triggered by a version tag push, e.g. git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  # ── Build one binary per platform ──────────────────────────────────────────
  build:
    name: build/${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: node/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          ASSET="honeybee-node-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          mkdir -p dist
          cd node
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o "../dist/${ASSET}" ./cmd

      - uses: actions/upload-artifact@v4
        with:
          # one artifact per matrix leg keeps names unique
          name: honeybee-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ── Collect all artifacts and publish a GitHub Release ─────────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases & upload assets

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true   # flatten all artifact dirs into dist/

      - name: List assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
