version: "3.9"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: honeybee_enhanced
      MYSQL_USER: honeybee
      MYSQL_PASSWORD: honeybeepw
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_DSN: "honeybee:honeybeepw@tcp(mysql:3306)/honeybee_enhanced?parseTime=true&charset=utf8mb4"
      JWT_SECRET: "dev-secret-change-me"
      HTTP_ADDR: "0.0.0.0:5100"
      NODE_ADDR: "0.0.0.0:9001"
      LOG_LEVEL: "info"
    ports:
      - "5100:5100"   # HTTP API
      - "9001:9001"   # Node TCP
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    depends_on: [core]
    ports: ["5173:80"]
    restart: unless-stopped

volumes:
  mysql_data:
